name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download ncnn (Android + Vulkan) and Real-ESRGAN models
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch_assets.sh

      - name: Install NDK and CMake
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Summarize build errors
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          try:
              lines = open("build.log", errors="replace").read().splitlines()
          except FileNotFoundError:
              lines = []
          keep = []
          for i, l in enumerate(lines):
              if re.search(r"(^e: |error:|ERROR|FAILED|What went wrong|Execution failed|undefined reference|fatal error|Could not|not found|cannot find|Unresolved|No matching)", l):
                  keep.append(l.strip())
          seen, out = set(), []
          for l in keep:
              if l not in seen:
                  seen.add(l)
                  out.append(l)
          for l in out[:9]:
              print("::error::" + l[:900].replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          if not out:
              print("::error::no error lines matched; tail: " + " | ".join(x.strip() for x in lines[-6:])[:900])
          PY

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AIEnhancer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AIEnhancer-apk
          path: AIEnhancer.apk

      - name: Publish to Releases (always the newest build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest AIEnhancer.apk \
            --title "AI Enhancer - latest build" \
            --notes "Debug APK built from commit ${GITHUB_SHA::7}. Download AIEnhancer.apk on your phone and install it (allow 'install unknown apps' if asked)."
