name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download ncnn (Android + Vulkan) and Real-ESRGAN models
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch_assets.sh

      - name: Install NDK and CMake
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AIEnhancer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AIEnhancer-apk
          path: AIEnhancer.apk

      - name: Publish to Releases (always the newest build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest AIEnhancer.apk \
            --title "AI Enhancer - latest build" \
            --notes "Debug APK built from commit ${GITHUB_SHA::7}. Download AIEnhancer.apk on your phone and install it (allow 'install unknown apps' if asked)."
